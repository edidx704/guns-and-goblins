name: Discord Notification

on:
  push:
    branches:
      - v4
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare build
        run: sleep 180

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Get changed files
        id: changed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'content/*.md' 2>/dev/null | head -5 || true)
          if [ -z "$CHANGED" ]; then
            echo "files=" >> $GITHUB_OUTPUT
          else
            # Just pass the raw file paths, Python will handle URL encoding
            echo "files<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGED" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Notify Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          python3 << 'PYTHON'
          import json
          import os
          import urllib.request
          import urllib.error
          import urllib.parse
          from datetime import datetime, timezone

          webhook_url = os.environ.get('WEBHOOK_URL', '').strip()
          role_id = os.environ.get('ROLE_ID', '').strip()
          raw_files = os.environ.get('CHANGED_FILES', '')
          commit_msg = os.environ.get('COMMIT_MSG', 'Content updated')[:50]

          # Build the file list with Quartz-style URL formatting
          if raw_files:
            file_links = []
            for file in raw_files.strip().split('\n'):
              if file:
                # Remove content/ prefix and .md suffix
                page = file.replace('content/', '').replace('.md', '')
                # Quartz slug format: spaces -> dashes, keep other chars
                slug = page.replace(' ', '-')
                file_links.append(f"• [{page}](https://guns-and-goblins.pages.dev/{slug})")
            files_field = '\n'.join(file_links)
          else:
            files_field = ''

          fields = [
            {"name": "Updated Pages", "value": files_field, "inline": False},
            {"name": "Site", "value": "[guns-and-goblins.pages.dev](https://guns-and-goblins.pages.dev/)", "inline": True}
          ] if files_field else [
            {"name": "Site", "value": "[guns-and-goblins.pages.dev](https://guns-and-goblins.pages.dev/)", "inline": False}
          ]

          payload = {
            "username": "Guns & Goblins",
            "content": f"<@&{role_id}> 📜 New lore content published!",
            "embeds": [{
              "title": "Guns & Goblins - Lore Updated",
              "url": "https://guns-and-goblins.pages.dev/",
              "color": 3447003,
              "fields": fields,
              "footer": {"text": commit_msg}
            }]
          }

          req = urllib.request.Request(
            webhook_url,
            data=json.dumps(payload).encode('utf-8'),
            headers={
              'Content-Type': 'application/json',
              'User-Agent': 'GunsAndGoblins-GitHub-Action/1.0'
            }
          )

          try:
            urllib.request.urlopen(req, timeout=30)
            print("✅ Discord notification sent!")
          except urllib.error.HTTPError as e:
            print(f"❌ HTTP {e.code}")
            print(f"Response: {e.read().decode('utf-8')}")
            raise
          PYTHON
